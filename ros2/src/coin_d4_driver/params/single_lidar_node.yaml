/**:
  ros__parameters:
    port: "/dev/ttyAMA1"
    frame_id: "base_scan"
    baudrate: 230400
    version: 4
    topic_name: "scan"
    reverse: False
    warmup_time: 5  # seconds
    # Per-angle minimum-range mask (Neo-R2D2 local patch). Flat triples
    # [start_deg, end_deg, min_range_m] in scan-bin angles (robot view with
    # reverse:false; 0=forward, CCW positive). Readings closer than
    # min_range_m inside the sector become NaN (no-return). start>end wraps
    # across 0 deg. Leave empty to disable (driver default: global 0.10 m).
    # Example — ignore self-return off the shell within 0.35 m behind the
    # robot, and a 0.5 m blind sector around the mast:
    #   sector_min_range: [150.0, 210.0, 0.35,
    #                      80.0,   100.0, 0.50]
    sector_min_range: []
