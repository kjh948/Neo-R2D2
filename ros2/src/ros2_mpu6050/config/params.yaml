# Sensor related parameters
mpu6050_sensor:
  ros__parameters:
    # Local fork additions: I2C device, slave address (0x68 AD0->GND, 0x69 AD0->VCC),
    # and frame_id of published Imu messages.
    device: "/dev/i2c-1"
    i2c_address: 0x68
    imu_frame: base_link
    #FS_SEL  |  Full Scale Range
    #        |
    #   0    |  +- 250 deg/s
    #   1    |  +- 500 deg/s
    #   2    |  +- 1000 deg/s
    #   3    |  +- 2000 deg/s
    gyro_fs_sel: 0
    #FS_SEL  |  Full Scale Range
    #        |
    #   0    |  +- 2 g
    #   1    |  +- 4 g
    #   2    |  +- 8 g
    #   3    |  +- 16 g
    accel_afs_sel: 0
    #DLPF_CFG  |  Accelerometer    |            Gyroscope
    #          |    (Fs=1khz)      |
    #          |    Bandwidth(Hz)  |     Bandwidth(Hz)   |      Fs(khz)
    #   0      |       260         |         256         |        8
    #   1      |       184         |         188         |        1
    #   2      |       94          |         98          |        1
    #   3      |       44          |         42          |        1
    #   4      |       21          |         20          |        1
    #   5      |       10          |         10          |        1
    #   6      |       5           |         5           |        1
    dlpf_cfg: 0
    #CLKSEL  |  Clock source
    #        |
    #   0    |  Internal 8MHz oscillator
    #   1    |  PLL with X axis gyroscope reference
    #   2    |  PLL with Y axis gyroscope reference
    #   3    |  PLL with Z axis gyroscope reference
    #   4    |  PLL with external 32.768kHz reference
    #   5    |  PLL with external 19.2MHz reference
    #   6    |  Reserved
    #   7    |  Stops the clock and keeps the timing generator in reset
    clock_src: 0

    # [deg/s]
    gyro_x_offset: -2.54664
    gyro_y_offset: -1.31122
    gyro_z_offset: 0.310198
    # [m/s²]
    accel_x_offset: 2.24779
    accel_y_offset: 0.220485
    accel_z_offset: 10.0218

    # Conservative starting values for an uncalibrated MPU6050. These should be
    # replaced with stationary measurements from `ros2 run ros2_mpu6050
    # analyze_imu --duration 30 --stationary` before final EKF tuning.
    # Units: (rad/s)^2 for gyro, (m/s^2)^2 for acceleration.
    gyro_x_variance: 1.0e-4
    gyro_y_variance: 1.0e-4
    gyro_z_variance: 2.0e-4
    accel_x_variance: 1.0e-3
    accel_y_variance: 1.0e-3
    accel_z_variance: 1.5e-3
