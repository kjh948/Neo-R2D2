# hector_mapping parameters for Neo-R2D2 (scan-only SLAM, no wheel odometry).
# Names match the humble fork's HectorMappingRos.cpp declares (Jazzy build).
#
# odom_frame == base_frame: with no odometry TF source, hector publishes the
# map->base_link transform directly. The base_link->base_laser TF comes from
# the static_transform_publisher inside the ldlidar launch include.
/**:
  ros__parameters:
    map_frame: "map"
    odom_frame: "base_link"
    base_frame: "base_link"
    scan_topic: "scan"

    map_resolution: 0.05        # [m/cell]
    map_size: 600               # -> 30 m x 30 m at 0.05 m
    map_start_x: 0.5
    map_start_y: 0.5
    map_multi_res_levels: 2
    map_pub_period: 2.0

    laser_min_dist: 0.05        # LD19 near limit
    laser_max_dist: 12.0        # LD19 range

    # Update triggers for a slow walker like R2-D2 (defaults 0.4 m / 0.9 rad
    # would barely re-map during small movements).
    map_update_distance_thresh: 0.2
    map_update_angle_thresh: 0.15

    update_factor_free: 0.4
    update_factor_occupied: 0.9

    use_tf_scan_transformation: true
    use_tf_pose_start_estimate: false
    map_with_known_poses: false
    pub_map_odom_transform: true
    pub_drawings: false
    pub_odometry: false
