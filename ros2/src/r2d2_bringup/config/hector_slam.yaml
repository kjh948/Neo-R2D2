# hector_mapping (scan-matching SLAM) params for Neo-R2D2 — NO odometry input.
# Names match the vendored hector_slam's HectorMappingRos.cpp declares (Jazzy build).
# hector estimates the motion from consecutive scans alone and publishes
#   map ->(hector)-> base_link ->(static)-> base_laser
# directly (odom_frame collapses onto base_frame — the classic scan-only setup
# validated on this robot in 2026-10). No rf2o, no separate odom TF source.
/**:
  ros__parameters:

    # ROS frames — scan-only: no odom frame in the chain
    map_frame: map
    odom_frame: base_link
    base_frame: base_link
    scan_topic: scan

    # Pure scan matching: no TF pose start estimate (nothing to estimate from),
    # hector owns the whole map->base_link transform.
    use_tf_scan_transformation: true
    use_tf_pose_start_estimate: false
    map_with_known_poses: false
    pub_map_odom_transform: true
    pub_map_scanmatch_transform: false
    pub_odometry: false
    pub_drawings: false
    advertise_map_service: true

    # Map geometry — resolution 0.05 matches slam_toolbox.yaml
    map_resolution: 0.05     # [m/cell]
    map_size: 600            # -> 30 m x 30 m at 0.05
    map_start_x: 0.5
    map_start_y: 0.5
    map_multi_res_levels: 2
    map_pub_period: 2.0

    # Laser limits match the COIN-D3 (same as slam_toolbox min/max_laser_range)
    laser_min_dist: 0.05
    laser_max_dist: 12.0
    laser_z_min_value: -1.0
    laser_z_max_value: 1.0

    # Update triggers for a slow walker like R2-D2 (same 0.2 m / 0.15 rad
    # thresholds as slam_toolbox minimum_travel_*; defaults 0.4 m / 0.9 rad
    # would barely re-map during small movements).
    map_update_distance_thresh: 0.2
    map_update_angle_thresh: 0.15

    update_factor_free: 0.4
    update_factor_occupied: 0.9
